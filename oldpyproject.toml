# ============================================
# PROJECT CONFIGURATION
# ============================================
[project]
name = "colosseum"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
	"ty>=0.0.1a34,<0.0.1a35",
	"pydantic>=2.12.5,<3",
	"evdev>=1.9.2,<2",
	"tyro>=1.0.1,<2",
	"pytest>=8.0.2,<10",
	"wandb>=0.24.1,<0.25.0",
	"ipykernel",
	"opencv-python>=4.13.0.92,<5",
]

[tool.pixi.workspace]
channels = [
	"https://prefix.dev/pixi-build-backends",
	"robostack-humble",
	"conda-forge",
	"https://prefix.dev/spqr",
]
platforms = ["linux-64", "linux-aarch64"]

# ============================================
# DEFAULT (TRAIN) ENVIRONMENT
# Requires linux-64 and CUDA 12.0
# ============================================
[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.system-requirements]
cuda = "12.0"

[tool.pixi.pypi-dependencies]
colosseum = {path = ".", editable = true}
loguru = "==0.7.3"
gymnasium = {version = "*", extras = ["classic_control"]}
mjlab = {git = "https://github.com/neverorfrog/mjlab.git", branch = "main", editable = true}
unified-planning = {git = "https://github.com/speckdavid/unified-planning", branch = "master", editable = true}
up-symk = "==1.4.2"

[tool.pixi.tasks]
train-rsl-rl = { cmd = "python -m colosseum.scripts.train_rsl_rl", description = "Train with RSL-RL (colosseum tasks)" }
train-mjlab = { cmd = "python -m mjlab.scripts.train", description = "Train with RSL-RL (mjlab built-in tasks)" }
train = { cmd = "python -m colosseum.scripts.train", description = "Train with custom PPO" }
train-phase2 = { cmd = "python research/dribbling/scripts/train_phase2.py", description = "RMA Phase 2 adaptation encoder training" }
pipeline-dribbling = { cmd = "python research/dribbling/scripts/pipeline_dribbling.py", description = "Full dribbling curriculum pipeline (Phase 1 + Phase 2 per stage)" }
play = { cmd = "python -m colosseum.scripts.play", description = "Evaluate trained policy in simulation" }
eval-dribbling = { cmd = "python research/dribbling/scripts/evaluate_dribbling.py", description = "Run the dribbling evaluation protocol" }
export-onnx = { cmd = "python -m colosseum.scripts.export_onnx", description = "Export checkpoint to ONNX" }

# ============================================
# ENVIRONMENTS
# ============================================
[tool.pixi.environments]
default = { solve-group = "default", platforms = ["linux-64"] }
deploy = { features = ["deploy"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true, solve-group = "docs" }

# ============================================
# DEPLOY FEATURE
# linux-64:    sim-to-sim testing (MuJoCo)
# linux-aarch64: real robot (Booster T1)
# ============================================
[tool.pixi.feature.deploy]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.feature.deploy.dependencies]
python = "3.11.*"
onnxruntime = ">=1.22.2,<2"

[tool.pixi.feature.deploy.pypi-dependencies]
colosseum = {path = ".", editable = true}

[tool.pixi.feature.deploy.target.linux-64.dependencies]
pytorch = "*"

[tool.pixi.feature.deploy.target.linux-64.pypi-dependencies]
mujoco = ">=3.4.0,<4"

[tool.pixi.feature.deploy.target.linux-aarch64.dependencies]
booster_robotics_sdk = "==1.5.0"
nanobind = ">=2.4,<3"

[tool.pixi.feature.deploy.target.linux-aarch64.pypi-dependencies]
torch = "*"
torchvision = "*"

[tool.pixi.feature.deploy.tasks]
deploy = { cmd = "python -m colosseum.scripts.deploy", description = "Deploy trained policy" }
gen-booster-stubs = { cmd = "python -m nanobind.stubgen -m booster_robotics_sdk_python -o typings/booster_robotics_sdk_python.pyi", description = "Generate stubs for booster_robotics_sdk_python into typings/" }

# ============================================
# DOCS FEATURE
# ============================================
[tool.pixi.feature.docs.dependencies]
mkdocs-material = ">=9.6.14,<10"

[tool.pixi.feature.docs.tasks]
build-docs = "mkdocs build --strict"
docs = { cmd = "mkdocs serve", description = "Serve the docs locally" }

# ============================================
# OTHER TOOLS
# ============================================
[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["typings", "models"]

[tool.ruff]
src = ["src"]
indent-width = 2
