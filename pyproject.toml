[project]
name = "colosseum"
version = "0.1.0"
requires-python = "==3.12.*"

[tool.pixi.workspace]
channels = [
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64"]

[tool.pixi.environments]
default = ["gpu"]
docs = { features = ["docs"], no-default-feature = true, solve-group = "default" }

[tool.pixi.feature.gpu.pypi-dependencies]
colosseum = {path = ".", editable = true}
mjlab = {git = "https://github.com/neverorfrog/mjlab.git", branch = "main"}

[tool.pixi.feature.docs.dependencies]
mkdocs-material = ">=9.6.14,<10"

[tool.pixi.feature.docs.tasks]
build-docs = "mkdocs build --strict"
docs = { cmd = "mkdocs serve", description = "Serve the docs locally" }

[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["typings", "models"]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project.entry-points."mjlab.tasks"]
cartpole = "colosseum.train.tasks.cartpole"
velocity = "colosseum.train.tasks.velocity"

[tool.ruff]
src = ["src"]
indent-width = 2

# [tool.pixi.activation.env]
# MUJOCO_GL="osmesa"

[tool.pixi.dependencies]
pytest = ">=9.0.1,<10"
