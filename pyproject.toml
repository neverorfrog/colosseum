# ============================================
# PROJECT CONFIGURATION
# ============================================
[project]
name = "colosseum"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
	"ty>=0.0.1a34,<0.0.1a35",
	"pydantic>=2.12.5,<3",
	"evdev>=1.9.2,<2",
	"tyro>=1.0.1,<2",
	"pytest>=8.0.2,<10",
]

[tool.pixi.workspace]
channels = [
	"https://prefix.dev/pixi-build-backends",
	"robostack-humble",
	"conda-forge",
	"https://prefix.dev/spqr",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

# ============================================
# TRAIN FEATURE
# ============================================
[tool.pixi.environments.train]
features = ["deploy", "train"]
no-default-feature = true
solve-group = "train"

[tool.pixi.feature.train]
platforms = ["linux-64"]

[tool.pixi.feature.train.dependencies]
python = "3.11.*"

[tool.pixi.feature.train.system-requirements]
cuda = "12.0"

[tool.pixi.feature.train.pypi-dependencies]
colosseum = {path = ".", editable = true}
loguru = "==0.7.3"
gymnasium = {version = "*", extras = ["classic_control"]}
mjlab = {git = "https://github.com/neverorfrog/mjlab.git", branch = "iros", editable = true}

[tool.pixi.feature.train.tasks]
train-rsl-rl = { cmd = "python -m colosseum.scripts.train_rsl_rl", description = "Train with RSL-RL (colosseum tasks)" }
train-mjlab = { cmd = "python -m mjlab.scripts.train", description = "Train with RSL-RL (mjlab built-in tasks)" }
train = { cmd = "python -m colosseum.scripts.train", description = "Train with custom PPO" }
play = { cmd = "python -m colosseum.scripts.play", description = "Evaluate trained policy in simulation" }
export-onnx = { cmd = "python -m colosseum.scripts.export_onnx", description = "Export checkpoint to ONNX" }

# ============================================
# DEPLOY FEATURE
# ============================================
[tool.pixi.environments.deploy]
features = ["deploy"]
no-default-feature = true
solve-group = "deploy"

[tool.pixi.feature.deploy]
platforms = ["linux-64"]

[tool.pixi.feature.deploy.dependencies]
python = "3.11.*"
pytorch = "*"
onnxruntime = ">=1.22.2,<2"

[tool.pixi.feature.deploy.pypi-dependencies]
mujoco = ">=3.4.0,<4"
colosseum = {path = ".", editable = true}

[tool.pixi.feature.deploy.tasks]
deploy = { cmd = "python -m colosseum.scripts.deploy", description = "Deploy trained policy" }

# ============================================
# ROBOT FEATURE
# ============================================
[tool.pixi.environments.robot]
features = ["robot"]
no-default-feature = true
solve-group = "robot"

[tool.pixi.feature.robot]
platforms = ["linux-aarch64"]

[tool.pixi.feature.robot.dependencies]
python = "3.9.*"
booster_robotics_sdk = "==1.5.0"
nanobind = ">=2.4,<3"

[tool.pixi.feature.robot.pypi-dependencies]
colosseum = {path = ".", editable = true}
torch = "*"
torchvision = "*"

[tool.pixi.feature.robot.tasks]
gen-booster-stubs = { cmd = "python -m nanobind.stubgen -m booster_robotics_sdk_python -o typings/booster_robotics_sdk_python.pyi", description = "Generate stubs for booster_robotics_sdk_python into typings/" }

