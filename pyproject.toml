[project]
name = "colosseum"
version = "0.1.0"
requires-python = "==3.11"

[tool.pixi.workspace]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/robostack-jazzy",
]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.pypi-dependencies]
colosseum = {path = ".", editable = true}
fast_td3 = {git = "https://github.com/younggyoseo/FastTD3.git", branch = "main"}
sshkeyboard = "==2.3.1"

[tool.pixi.feature.gpu.system-requirements]
cuda = "12.0"

[tool.pixi.feature.gpu.pypi-dependencies]
mjlab = {git = "https://github.com/neverorfrog/mjlab.git", branch = "main"}

[tool.pixi.feature.gpu.dependencies]
cuda-version = "12.6.*"
pytorch-gpu = "==2.7.0"

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = "==2.7.0"

[tool.pixi.environments]
cpu = ["cpu"]
default = ["gpu"]
docs = { features = ["docs"], no-default-feature = true, solve-group = "default" }

[tool.pixi.feature.docs.dependencies]
mkdocs-material = ">=9.6.14,<10"

[tool.pixi.activation.env]
PATH = "$CONDA_PREFIX/bin:$PATH"
LD_LIBRARY_PATH = "$LD_LIBRARY_PATH:$CONDA_PREFIX/lib"
PYTHONPATH = "/usr/local/lib/python3.11/dist-packages:$PYTHONPATH"

[tool.pixi.feature.docs.tasks]
build-docs = "mkdocs build --strict"
docs = { cmd = "mkdocs serve", description = "Serve the docs locally" }

[tool.pixi.feature.cpu.tasks]
deploy-cpu = "python -m colosseum.scripts.deploy"
play-mujoco-cpu = "python -m colosseum.scripts.play_mujoco"

[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["typings", "models"]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project.entry-points."mjlab.tasks"]
colosseum = "colosseum.train.tasks"
