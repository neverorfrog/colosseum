[project]
name = "colosseum"
version = "0.1.0"
requires-python = ">=3.9"

# ============================================
# PIXI WORKSPACE CONFIGURATION
# ============================================
[tool.pixi.workspace]
channels = ["robostack-humble", "conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.environments]
train = {features = ["train"], no-default-feature = true}
deploy = {features = ["deploy"], no-default-feature = true}
docs = { features = ["docs"], no-default-feature = true}

# ============================================
# TRAIN FEATURE
# ============================================
[tool.pixi.feature.train.dependencies]
python = "3.11.*"
pytest = ">=9.0.1,<10"

[tool.pixi.feature.train.pypi-dependencies]
colosseum = {path = ".", editable = true}
mjlab = {git = "https://github.com/mujocolab/mjlab.git", branch = "main"}

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project.entry-points."mjlab.tasks"]
cartpole = "colosseum.tasks.cartpole"
velocity = "colosseum.tasks.velocity"

# ============================================
# DEPLOY FEATURE
# ============================================
[tool.pixi.feature.deploy.dependencies]
python = "3.9.*"
pytest = ">=8.0,<9"
mujoco = ">=3.0,<4"
booster_robotics_sdk = {git = "https://github.com/neverorfrog/booster_robotics_sdk.git", branch = "main"}
ros-humble-booster-interface = {git = "https://github.com/neverorfrog/booster_robotics_sdk_ros2.git", branch = "main", subdirectory = "booster_ros2_interface"}
cuda-version = "12.6.*"
pytorch-gpu = "*"
ros-humble-rclpy = ">=3.3.4,<4"
nanobind = ">=2.4,<3"

[tool.pixi.feature.deploy.pypi-dependencies]
colosseum = {path = ".", editable = true}

[tool.pixi.feature.deploy.system-requirements]
cuda = "12.0"

[tool.pixi.feature.deploy.tasks]
deploy = "python src/colosseum/deploy/scripts/deploy.py"
gen-booster-stubs = { cmd = "python -m nanobind.stubgen -m booster_robotics_sdk_python -o typings/booster_robotics_sdk_python.pyi", description = "Generate stubs for booster_robotics_sdk_python into typings/" }

# ============================================
# DOCS FEATURE
# ============================================
[tool.pixi.feature.docs.dependencies]
mkdocs-material = ">=9.6.14,<10"

[tool.pixi.feature.docs.tasks]
build-docs = "mkdocs build --strict"
docs = { cmd = "mkdocs serve", description = "Serve the docs locally" }

# ============================================
# OTHER TOOLS
# ============================================
[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["typings", "models"]

[tool.ruff]
src = ["src"]
indent-width = 2
