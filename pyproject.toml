[project]
name = "colosseum"
version = "0.1.0"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ty.environment]
python = ".pixi/envs/default"
extra-paths = ["typings"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["typings", "models"]

[tool.ruff]
src = ["src"]
indent-width = 2
